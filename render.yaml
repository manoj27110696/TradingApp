services:
  - type: web
    name: options-spread-copilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_API_KEY
        generateValue: true
      - key: TRADIER_BASE_URL
        value: https://api.tradier.com/v1
      - key: DEFAULT_SYMBOLS
        value: SPY,QQQ,IWM,AAPL,MSFT,NVDA,TSLA
