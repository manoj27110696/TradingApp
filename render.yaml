services:
  - type: web
    name: options-spread-copilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_API_KEY
        generateValue: true
      - key: CUTEMARKETS_BASE_URL
        value: https://api.cutemarkets.com
      - key: CUTEMARKETS_CHAIN_STRIKE_WINDOW_PCT
        value: 0.12
      - key: DEFAULT_SYMBOLS
        value: SPY,QQQ,IWM,AAPL,MSFT,NVDA,TSLA
