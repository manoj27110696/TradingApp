services:
  - type: web
    name: options-spread-copilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: CUTEMARKETS_BASE_URL
        value: https://api.cutemarkets.com
      - key: CUTEMARKETS_CHAIN_STRIKE_WINDOW_PCT
        value: 0.12
      - key: CUTEMARKETS_REQUEST_TIMEOUT_SECONDS
        value: 8
      - key: CUTEMARKETS_MAX_EXPIRATION_PAGES
        value: 2
      - key: MARKET_DATA_CACHE_TTL_SECONDS
        value: 300
      - key: SCAN_TIMEOUT_SECONDS
        value: 45
      - key: MAX_SCAN_SYMBOLS
        value: 5
      - key: SCAN_CONCURRENCY
        value: 3
      - key: PUBLIC_RATE_LIMIT_REQUESTS
        value: 60
      - key: PUBLIC_RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: DEFAULT_SYMBOLS
        value: SPY,QQQ,IWM,AAPL,MSFT,NVDA,TSLA
